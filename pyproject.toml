[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sprotein"
dynamic = ["version"]
description = "Shortest water/protein paths from a reference atom to bulk water in MD trajectories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "MDAnalysis>=2.0",
    "numpy",
    "scipy",
    "matplotlib",
    "tqdm",
    "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sprotein = "sprotein.cli:main"

[project.urls]
Repository = "https://github.com/NDiFonte/SProtein"

[tool.setuptools]
packages = ["sprotein"]

[tool.setuptools.dynamic]
version = { attr = "sprotein.__version__" }
